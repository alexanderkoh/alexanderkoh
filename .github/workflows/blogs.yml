name: Latest blog posts

on:
  schedule:
    - cron: "41 5 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update README with the latest Medium posts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://medium.com/feed/@atl4st"
          max_post_count: 5
