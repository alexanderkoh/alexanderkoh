name: Contribution snake

on:
  schedule:
    - cron: "17 4 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/snake.yml]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#b45309&color_dots=#ebedf0,#fde68a,#fbbf24,#d97706,#92400e
            dist/snake-dark.svg?palette=github-dark&color_snake=#f2b33d&color_dots=#161b22,#3d2e12,#6b4c16,#b07a1c,#f2b33d

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
